{% extends 'base.html' %}

{% block content %}
<br><br>
<h3>Password Reset Confirmation</h3>
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="Change password">
        </form>
    {% else %}
        <p>
            Invalid password reset link!
        </p>
{% endif %}
{% endblock %}
