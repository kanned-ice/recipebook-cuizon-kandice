{% extends 'base.html' %}
{% load static %}


{% block title %}Recipe Book{% endblock %}
{% block content %}
<br><br>
<h3>Recipe List</h3>
<ul>
   {% for recipe in recipe_list %}
       <li>
           <a href="{{recipe.get_absolute_url}}">
               {{recipe}}
           </a>
       </li>
   {% endfor %}
</ul>


{% endblock %}
