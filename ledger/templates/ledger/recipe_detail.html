{% extends 'base.html' %}
{% load static %}

{% block title %}Recipe Book{% endblock %}
{% block content %}
<br><br>
<h3>Recipe Details</h3>
<ul>
   {{recipe}} by user {{recipe.author.name}}
   <br><br>
  
   {% for ingredient in recipe.ingredients.all %}
       <li>
           {{ingredient}}
       </li>
   {% endfor %}
</ul>

{% endblock %}
